<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고픽</title>
<meta name="description" content="고등학교 진로를 콕 집어주는 앱, 고픽">
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5f6368; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f1f1f1; --muted: #a0a0a0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>고픽</h1>
  <p>고등학교 진로를 콕 집어주는 앱. 고등학교를 찾고, 입시 요강을 보고, 내 성적으로 지원 가능성을 점검합니다.</p>
</main>
</body>
</html>
